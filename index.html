<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palco do Jogo</title>
    <link rel="stylesheet" href="index-style.css">
    <link rel="stylesheet" href="src/ui/interacoes/base-interacao.css?v=20260418-base-interaction">
</head>
<body>
    <div id="jogo-container">
        <div id="game-stage">
            <!-- LAYERS DO JOGO -->
            <div class="game-layer" id="layer-fundo" data-z-index="0"></div>
            <div class="game-layer" id="layer-plataformas" data-z-index="5"></div>
            <div class="game-layer" id="layer-decoracoes" data-z-index="10"></div>
            <div class="game-layer" id="layer-inimigos" data-z-index="15"></div>
            <div class="game-layer" id="layer-jogador" data-z-index="20">
                <img id="player" class="character" src="assets/personagem/Personagem_parado.png" alt="Personagem">
            </div>
            <div class="game-layer" id="layer-itens" data-z-index="23"></div>
            <div class="game-layer" id="layer-projeteis" data-z-index="25"></div>
            <div class="game-layer" id="layer-efeitos" data-z-index="30"></div>
            <div class="game-layer" id="layer-ui" data-z-index="50"></div>
        </div>
    </div>

    <!-- Config & Utilities (Devem carregar ANTES dos outros scripts) -->
    <script src="src/config/constants.js"></script>
    <script src="src/utils/viewport.js"></script>
    <script src="src/utils/debug.js"></script>
    <script src="src/visual/ajuste-tela.js"></script>

    <!-- Core (Fundamental) -->
    <script src="src/core/inicial.js?v=20260419-base-restore-fix2"></script>
    <script src="src/core/colisoes.js?v=20260417-crafting"></script>
    <script src="src/core/estacas.js"></script>
    <script src="src/core/gravidade.js?v=20260419-shield-refactor"></script>
    <script src="src/core/interacao-sistema.js?v=20260419-base-level2-memory"></script>
    <script src="src/core/posicao-inicial.js"></script>

    <!-- Jogador (Player) -->
    <script src="src/jogador/inventario.js?v=20260419-base-restore-fix2"></script>
    <script src="src/jogador/controles.js?v=20260417-dash-skill"></script>
    <script src="src/ui/hud.js"></script>
    <script src="src/jogador/garra.js?v=20260419-shield-refactor"></script>
    <script src="src/jogador/dano-estacas.js?v=20260419-shield-refactor"></script>
    <script src="src/jogador/acoes-especiais.js?v=20260417-crafting"></script>
    <script src="src/jogador/crafting.js?v=20260419-base-level2-memory"></script>
    <script src="src/jogador/jetpack.js"></script>
    <script src="src/jogador/combate-corpo-a-corpo.js?v=20260419-shield-refactor"></script>
    <script src="src/jogador/movimento.js?v=20260419-shield-refactor"></script>
    <script src="src/jogador/animacao.js"></script>
    <script src="src/itens/itens.js"></script>
    <script src="src/jogador/skills-efeitos.js?v=20260417-dash-skill"></script>

    <!-- Inimigos (Enemies AI) -->
    <script src="src/inimigos/inimigo.js?v=20260417-console-fix"></script>
    <script src="src/inimigos/morte-inimigo.js"></script>
    <script src="src/inimigos/ia-inimigo.js?v=20260419-shield-refactor"></script>

    <!-- Skills (Abilities) -->
    <script src="src/skills/skills.js?v=20260417-dash-skill"></script>

    <!-- Visual (Rendering) -->
    <script src="src/visual/layers.js"></script>
    <script src="src/visual/cenario.js"></script>
    <script src="src/visual/camera.js"></script>
    <script src="src/visual/grade-debug.js"></script>
    <script src="src/visual/efeitos-visuais.js"></script>
    <script src="src/visual/animacoes-equipamento.js?v=20260417-garra-danificada"></script>

    <!-- UI (Menu) -->
    <script src="src/ui/mochila.js?v=20260417-storage-icons"></script>
    <script src="src/ui/menu.js?v=20260419-base-checkpoint-rule"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializa a grade de visualização
            configurarGrade('game-stage');

            // O inicializador agora cuida de todo o carregamento das fases e personagens
            iniciarJogo();
        });
    </script>
</body>
</html>
