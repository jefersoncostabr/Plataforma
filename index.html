<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palco do Jogo</title>
    <link rel="stylesheet" href="index-style.css">
</head>
<body>
    <div id="jogo-container">
        <div id="game-stage">
            <!-- LAYERS DO JOGO -->
            <div class="game-layer" id="layer-fundo" data-z-index="0"></div>
            <div class="game-layer" id="layer-plataformas" data-z-index="5"></div>
            <div class="game-layer" id="layer-decoracoes" data-z-index="10"></div>
            <div class="game-layer" id="layer-inimigos" data-z-index="15"></div>
            <div class="game-layer" id="layer-jogador" data-z-index="20">
                <img id="player" class="character" src="assets/personagem/Personagem_parado.png" alt="Personagem">
            </div>
            <div class="game-layer" id="layer-itens" data-z-index="23"></div>
            <div class="game-layer" id="layer-projeteis" data-z-index="25"></div>
            <div class="game-layer" id="layer-efeitos" data-z-index="30"></div>
            <div class="game-layer" id="layer-ui" data-z-index="50"></div>
        </div>
    </div>

    <!-- Config & Utilities (Devem carregar ANTES dos outros scripts) -->
    <script src="src/config/constants.js"></script>
    <script src="src/utils/viewport.js"></script>
    <script src="src/utils/debug.js"></script>

    <!-- Core (Fundamental) -->
    <script src="src/core/inicial.js"></script>
    <script src="src/core/colisoes.js"></script>
    <script src="src/core/estacas.js"></script>
    <script src="src/core/gravidade.js"></script>
    <script src="src/core/posicao-inicial.js"></script>

    <!-- Jogador (Player) -->
    <script src="src/jogador/movimento.js"></script>
    <script src="src/jogador/animacao.js"></script>
    <script src="src/itens/itens.js"></script>
    <script src="src/jogador/skills-efeitos.js"></script>

    <!-- Inimigos (Enemies AI) -->
    <script src="src/inimigos/inimigo.js"></script>
    <script src="src/inimigos/ia-inimigo.js"></script>

    <!-- Skills (Abilities) -->
    <script src="src/skills/skills.js"></script>

    <!-- Visual (Rendering) -->
    <script src="src/visual/layers.js"></script>
    <script src="src/visual/cenario.js"></script>
    <script src="src/visual/camera.js"></script>
    <script src="src/visual/grade-debug.js"></script>
    <script src="src/visual/efeitos-visuais.js"></script>
    <script src="src/visual/animacoes-equipamento.js"></script>

    <!-- UI (Menu) -->
    <script src="src/ui/menu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializa a grade de visualização
            configurarGrade('game-stage');

            // O inicializador agora cuida de todo o carregamento das fases e personagens
            iniciarJogo();
        });
    </script>
</body>
</html>
