<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palco do Jogo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333;
            margin: 0;
            overflow: hidden;
        }
        #jogo-container {
            width: 640px;
            height: 480px;
            background-color: #222;
            border: 4px solid #fff;
            position: relative;
            overflow: hidden; /* ESSENCIAL: Recorta o que sair dos 640x480 */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #game-stage {
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: #555;
            /* Largura e altura são definidas dinamicamente pelo inicializador.js */
        }
        .character {
            position: absolute;
            bottom: 0; 
            left: 0;
            /* Removido o transform fixo para o JS controlar a direção */
            width: 32px; /* Tamanho do personagem */
            height: 32px; /* Tamanho do personagem */
            image-rendering: pixelated; /* Garante que o pixel art não seja suavizado */
        }
        /* Estilos para o HUD da Skill Visão */
        .hud-circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid #000;
        }
        .hud-square {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="jogo-container">
        <div id="game-stage">
            <img id="player" class="character" src="assets/personagem/Personagem_parado.png" alt="Personagem">
        </div>
    </div>

    <!-- Core (Fundamental) -->
    <script src="src/core/inicial.js"></script>
    <script src="src/core/colisoes.js"></script>
    <script src="src/core/estacas.js"></script>
    <script src="src/core/gravidade.js"></script>
    <script src="src/core/posicao-inicial.js"></script>

    <!-- Jogador (Player) -->
    <script src="src/jogador/movimento.js"></script>
    <script src="src/jogador/animacao.js"></script>
    <script src="src/jogador/skills-efeitos.js"></script>

    <!-- Inimigos (Enemies AI) -->
    <script src="src/inimigos/inimigo.js"></script>
    <script src="src/inimigos/ia-inimigo.js"></script>

    <!-- Skills (Abilities) -->
    <script src="src/skills/skills.js"></script>

    <!-- Visual (Rendering) -->
    <script src="src/visual/cenario.js"></script>
    <script src="src/visual/camera.js"></script>
    <script src="src/visual/grade-debug.js"></script>
    <script src="src/visual/efeitos-visuais.js"></script>
    <script src="src/visual/animacoes-equipamento.js"></script>

    <!-- UI (Menu) -->
    <script src="src/ui/menu.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializa a grade de visualização
            configurarGrade('game-stage');

            // O inicializador agora cuida de todo o carregamento das fases e personagens
            iniciarJogo();
        });
    </script>
</body>
</html>
