<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palco do Jogo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333;
            margin: 0;
            overflow: hidden;
        }
        #game-stage {
            width: 640px; /* Exemplo: 20 tiles de 32px */
            height: 480px; /* Exemplo: 15 tiles de 32px */
            background-color: #555;
            border: 2px solid #fff;
            position: relative;
            overflow: hidden;
        }
        .character {
            position: absolute;
            bottom: 0; 
            left: 0;
            /* Removido o transform fixo para o JS controlar a direção */
            width: 32px; /* Tamanho do personagem */
            height: 32px; /* Tamanho do personagem */
            image-rendering: pixelated; /* Garante que o pixel art não seja suavizado */
        }
        /* Estilos para o HUD da Skill Visão */
        .hud-circle {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid #000;
        }
        .hud-square {
            width: 10px;
            height: 10px;
            background-color: #fff;
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <div id="game-stage">
        <img id="player" class="character" src="personagem/Personagem_parado.png" alt="Personagem">
    </div>

    <script src="animacao_andando.js"></script>
    <script src="posicionamento.js"></script>
    <script src="colisao.js"></script>
    <script src="grade.js"></script>
    <script src="fisica.js"></script>
    <script src="inimigo.js"></script>
    <script src="inimigoMovimentacao.js"></script>
    <script src="cenario.js"></script>
    <script src="efeitos.js"></script>
        <script src="skillsEfeitos.js"></script>
        <script src="skills.js"></script>
    <script src="movimentacao.js"></script>
    <script src="inicializador.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializa a grade de visualização
            configurarGrade('game-stage');

            // O inicializador agora cuida de todo o carregamento das fases e personagens
            iniciarJogo();
        });
    </script>
</body>
</html>
