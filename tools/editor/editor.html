<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Plataforma - Editor de Fases</title>
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div id="editor-container">
        <div id="palette">
            <h3>Elementos</h3>
            <div class="category">
                <h4>Tamanho do Mundo</h4>
                <select id="proportion-select" style="width: 100%; padding: 5px; margin-bottom: 10px;">
                    <option value="1x1">1x1 (640x480)</option>
                    <option value="1x2">1x2 (1280x480)</option>
                    <option value="2x1">2x1 (640x960)</option>
                    <option value="2x2">2x2 (1280x960)</option>
                </select>
            </div>
            <div class="category">
                <h4>Blocos</h4>
                <img src="../../assets/personagem/chao.png" class="palette-item selected" data-type="plataforma" title="Plataforma">
                <img src="../../assets/personagem/chao_neve.png" class="palette-item" data-type="plataformaNeve" title="Chão de Neve">
                <img src="../../assets/personagem/terra_inferior.png" class="palette-item" data-type="terraInferior" title="Terra Inferior (Meio Bloco)">
                <img src="../../assets/personagem/terra_superior.png" class="palette-item" data-type="terraSuperior" title="Terra Superior (Meio Bloco)">
                <img src="../../assets/personagem/terra_inferior2.png" class="palette-item" data-type="terraInferior2" title="Terra Inferior 2 (Meio Bloco)">
                <img src="../../assets/personagem/terra_superior2.png" class="palette-item" data-type="terraSuperior2" title="Terra Superior 2 (Meio Bloco)">
                <img src="../../assets/personagem/estacasup.png" class="palette-item" data-type="estacaSup" title="Estaca Superior">
                <img src="../../assets/personagem/estacadir.png" class="palette-item" data-type="estacaDir" title="Estaca Direita">
                <img src="../../assets/personagem/estacaesq.png" class="palette-item" data-type="estacaEsq" title="Estaca Esquerda">
                <img src="../../assets/personagem/estacasdown.png" class="palette-item" data-type="estacaBaixo" title="Estaca Baixo">
            </div>
            <div class="category">
                <h4>Inimigos</h4>
                <img src="../../assets/personagem/Personagem_parado.png" class="palette-item" data-type="inimigo_comum" title="Inimigo Melee">
                <img src="../../assets/personagem/revolver_pegavel.png" class="palette-item" data-type="inimigo_revolver" title="Inimigo Atirador">
                <img src="../../assets/personagem/escudo_pegavel.png" class="palette-item" data-type="inimigo_escudo" title="Inimigo Escudado">
                <img src="../../assets/personagem/bota_pegavel.png" class="palette-item" data-type="inimigo_bota" title="Inimigo Rápido (Botas)">
                <img src="../../assets/personagem/jetpack_pegavel.png" class="palette-item" data-type="inimigo_jetpack" title="Inimigo Voador (Jetpack)">
                <img src="../../assets/personagem/alvoFeno.png" class="palette-item" data-type="inimigo_feno" title="Alvo de Feno (Treino)">
                <img src="../../assets/personagem/garra_coletavel.png" class="palette-item" data-type="inimigo_garra" title="Inimigo com Garra">
                <img src="../../assets/personagem/cinto_coletavel.png" class="palette-item" data-type="inimigo_cinto" title="Inimigo com Cinto">
            </div>
            <div class="category">
                <h4>Itens</h4>
                <!-- Itens serão inseridos dinamicamente pelo JS -->
            </div>
            <div class="category">
                <h4>Sistema</h4>
                <img src="../../assets/personagem/Personagem_parado.png" style="filter: hue-rotate(90deg);" class="palette-item" data-type="player" title="Início Jogador">
                <img src="../../assets/personagem/objetivo.png" class="palette-item" data-type="objetivo" title="Objetivo">
            </div>
            <hr>
            <div class="category">
                <h4>Inimigo Aleatório</h4>
                <div class="config-group">
                    <label><input type="checkbox" id="spawn-random" checked> Habilitar</label>
                </div>
                <div id="random-config-fields">
                    <div class="config-group">
                        <label>Frequência:</label>
                        <select id="random-diff">
                            <option value="1">Fácil (60s)</option>
                            <option value="2">Médio (45s)</option>
                            <option value="3">Difícil (30s)</option>
                        </select>
                    </div>
                    <div class="config-group">
                        <label>Equipamento:</label>
                        <select id="random-type">
                            <option value="0">Nenhum (Melee)</option>
                            <option value="1">Revólver</option>
                            <option value="2">Escudo</option>
                            <option value="3">Botas</option>
                            <option value="4">Jetpack</option>
                            <option value="6">Garra</option>
                            <option value="7">Cinto</option>
                        </select>
                    </div>
                </div>
            </div>
            <hr>
            <div class="category">
                <h4>Fases Existentes</h4>
                <button id="btn-refresh-phases" style="background: #0d6efd;">Atualizar Lista</button>
                <div id="phase-list" class="phase-list">
                    <div class="phase-list-empty">Clique em Atualizar Lista para detectar as fases.</div>
                </div>
            </div>
            <hr>
            <button id="btn-export">Exportar JSON</button>
            <button id="btn-import" style="background: #28a745;">Importar JSON</button>
            <button id="btn-clear" style="background: #600;">Limpar Tudo</button>
            <div class="info">
                <p><strong>G</strong>: Alternar Grade</p>
                <p><strong>Clique</strong>: Adicionar</p>
                <p><strong>Botão Dir.</strong>: Remover</p>
            </div>
        </div>

        <div id="stage-area">
            <div id="game-stage">
                <!-- A grade e os elementos serão inseridos aqui -->
            </div>
            <div id="output-container">
                <textarea id="json-output" placeholder="Cole o JSON aqui e clique em Importar..."></textarea>
            </div>
        </div>
    </div>

    <!-- Scripts auxiliares simulando o motor do jogo -->
    <script src="editor-config.js?v=20260416-sparsefix"></script>
    <script src="editor-utils.js?v=20260416-sparsefix"></script>
    <script src="editor-render.js?v=20260416-sparsefix"></script>
    <script src="editor-persistence.js?v=20260416-sparsefix"></script>
    <script src="editor-ui.js?v=20260416-sparsefix"></script>
    <script src="editor.js?v=20260416-sparsefix"></script>
</body>
</html>
