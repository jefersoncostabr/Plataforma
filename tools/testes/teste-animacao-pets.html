<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Automatizado - Animacao Pets (Cao e Gato)</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        .pass { color: #0f0; font-weight: bold; }
        .fail { color: #f00; font-weight: bold; }
        .info { color: #0ff; }
        h1 { color: #0f0; }
        #resultado { margin-top: 20px; line-height: 1.6; }
        .teste { margin-bottom: 12px; padding: 8px; border: 1px solid #333; background: #0a0a0a; }
    </style>
</head>
<body>
    <h1>Teste Automatizado: Animacao de Andar - Cao e Gato</h1>
    <div id="resultado"></div>

    <script>
        // ==================== RESULTADO ====================
        let total = 0;
        let passou = 0;
        let falhou = 0;

        function log(msg, tipo = 'info') {
            const el = document.getElementById('resultado');
            const div = document.createElement('div');
            div.className = tipo;
            div.textContent = msg;
            el.appendChild(div);
            console.log(msg);
        }

        function assert(condicao, nomeTeste) {
            total++;
            if (condicao) {
                passou++;
                log('[PASS] ' + nomeTeste, 'pass');
            } else {
                falhou++;
                log('[FALHA] ' + nomeTeste, 'fail');
            }
        }

        // ==================== AMBIENTE MOCK ====================
        // Cria o game-stage necessario pelos scripts
        const gameStage = document.createElement('div');
        gameStage.id = 'game-stage';
        document.body.appendChild(gameStage);

        // Mock de LAYERS simples
        window.LAYERS = {
            INIMIGOS: 'inimigos',
            ITENS: 'itens',
            DECORACOES: 'decoracoes'
        };
        window.adicionarAoLayer = function(el, layer) {
            gameStage.appendChild(el);
        };

        // Mock de playerControle
        window.playerControle = {
            x: 100,
            y: 100,
            direcao: 'd',
            noChao: true,
            estaMorrendo: false,
            offsetX: 0,
            altura: 25,
            largura: 20,
            velocidadeY: 0
        };

        // Mock de plataformas (vazio, sem colisao)
        window.plataformas = [];

        // Mock de funcoes de colisao usadas pelos pets
        window.detectarColisaoHitbox = function() { return false; };
        window.verificarColisaoComTiles = function() { return false; };
        window.aplicarDeslocamentoHorizontalComColisaoPadrao = function(pet, dx) {
            pet.x += dx;
        };
        window.aplicarFisica = function() {};
        window.aplicarSnapColisaoPadrao = function(y) { return y; };

        // Mock de AudioManager
        window.AudioManager = { playSFX: function() {} };

        // Configuracao do jogo (sprites dos pets)
        window.config = {
            spriteCao: '../../assets/personagem/cao_parado.png',
            spriteGato: '../../assets/personagem/gato_parado.png',
            spriteCaoAndando: '../../assets/personagem/cao_mov.png',
            spriteGatoAndando: '../../assets/personagem/gato_andando.png',
            spriteCaoMordendo: '../../assets/personagem/cao_mordendo.png',
            spriteGatoMordendo: '../../assets/personagem/gato_mordendo.png',
            velocidadeCao: 3,
            velocidadeGato: 3,
            distanciaMinimaCaoSeguir: 45,
            distanciaMinimaGatoSeguir: 45,
            distanciaMaxTeleporteCao: 600,
            gravidadeUniversal: true,
            forcaGravidade: { forcaPulo: 10, gravidade: 0.5 },
            caoAlcancePuloY: 32,
            caoAlcancePuloX: 80
        };

        // ==================== CARREGA SCRIPTS DO JOGO ====================
        // Carrega pet-habilidades, animacoes-pets, cao.js (que sobrescreve inicializarPetNPC)
        // Nota: carregamos dinamicamente para isolar o teste
        function carregarScript(src) {
            return new Promise((resolve) => {
                const s = document.createElement('script');
                s.src = src;
                s.onload = resolve;
                document.head.appendChild(s);
            });
        }

        async function iniciarTeste() {
            try {
                await carregarScript('../../src/core/pet-habilidades.js');
                await carregarScript('../../src/visual/animacoes-pets.js');
                await carregarScript('../../src/jogador/animacao.js'); // define atualizarAnimacao
                await carregarScript('../../src/core/cao.js'); // sobrescreve inicializarPetNPC

                // Aguarda um frame para garantir que tudo carregou
                await new Promise(r => setTimeout(r, 100));

                executarTestes();
            } catch (e) {
                log('[ERRO] Falha ao carregar scripts: ' + e.message, 'fail');
            }
        }

        // ==================== TESTES ====================
        function executarTestes() {
            log('--- Iniciando testes de animacao dos pets ---', 'info');

            // Teste 1: inicializarPetNPC existe
            assert(typeof window.inicializarPetNPC === 'function', 'inicializarPetNPC e uma funcao');

            // Teste 2: atualizarAnimacao existe (definida em animacao.js via cao.js/pets.js)
            assert(typeof window.atualizarAnimacao === 'function', 'window.atualizarAnimacao e uma funcao');

            // Teste 3: Criar PET CAO e verificar que ele existe e tem spriteAndando
            window.inicializarPetNPC('cao', 50, 50, window.config);
            const cao = window.caoEntidade;
            assert(cao !== null, 'CaoEntidade foi criado');
            assert(cao.tipo === 'cao', 'Tipo do pet e cao');
            assert(cao.spriteAndando && cao.spriteAndando.includes('cao_mov'), 'Cao tem spriteAndando definido (cao_mov.png)');
            assert(cao.spriteParado && cao.spriteParado.includes('cao_parado'), 'Cao tem spriteParado definido (cao_parado.png)');

            // Teste 4: Criar PET GATO e verificar que ele existe e tem spriteAndando
            window.inicializarPetNPC('gato', 80, 50, window.config);
            const gato = window.gatoEntidade;
            assert(gato !== null, 'GatoEntidade foi criado');
            assert(gato.tipo === 'gato', 'Tipo do pet e gato');
            assert(gato.spriteAndando && gato.spriteAndando.includes('gato_andando'), 'Gato tem spriteAndando definido (gato_andando.png)');
            assert(gato.spriteParado && gato.spriteParado.includes('gato_parado'), 'Gato tem spriteParado definido (gato_parado.png)');

            // Teste 5: Simular movimento horizontal do CAO - sprite deve trocar para andando
            cao.movendoHorizontal = true;
            cao.noChao = true;
            cao.contadorAnimacao = 0;
            cao.frameAtual = 0;
            window.atualizarAnimacao(cao, cao.elemento, cao.spriteParado, cao.spriteAndando, null, null, null);
            // O frame muda a cada 10 contador, entao forçamos contador >= 10 para trocar
            cao.contadorAnimacao = 10;
            window.atualizarAnimacao(cao, cao.elemento, cao.spriteParado, cao.spriteAndando, null, null, null);
            const caoSrcAposAndar = cao.elemento.src;
            const caoAndou = caoSrcAposAndar.includes('cao_mov') || caoSrcAposAndar.includes('cao_parado');
            assert(caoAndou, 'Cao alterou o src ao executar atualizarAnimacao enquanto movendoHorizontal=true');

            // Teste 6: Simular movimento horizontal do GATO - sprite deve trocar para andando
            // Antes da correcao, o gato travava em parado se noChao fosse falso ou nao atendesse a condicao
            gato.movendoHorizontal = true;
            gato.noChao = true;
            gato.contadorAnimacao = 0;
            gato.frameAtual = 0;
            window.atualizarAnimacao(gato, gato.elemento, gato.spriteParado, gato.spriteAndando, null, null, null);
            gato.contadorAnimacao = 10;
            window.atualizarAnimacao(gato, gato.elemento, gato.spriteParado, gato.spriteAndando, null, null, null);
            const gatoSrcAposAndar = gato.elemento.src;
            const gatoAndou = gatoSrcAposAndar.includes('gato_andando') || gatoSrcAposAndar.includes('gato_parado');
            assert(gatoAndou, 'Gato alterou o src ao executar atualizarAnimacao enquanto movendoHorizontal=true');

            // Teste 7: Gato se movendo MAS sem noChao (simulacao do problema reportado)
            // Antes da correcao, isso travava o sprite em parado para pets.
            gato.movendoHorizontal = true;
            gato.noChao = false; // simulando pulo/quica no ar enquanto se move
            gato.contadorAnimacao = 0;
            gato.frameAtual = 0;
            window.atualizarAnimacao(gato, gato.elemento, gato.spriteParado, gato.spriteAndando, null, null, null);
            gato.contadorAnimacao = 10;
            window.atualizarAnimacao(gato, gato.elemento, gato.spriteParado, gato.spriteAndando, null, null, null);
            // Mesmo sem noChao, o gato deve continuar tentando animar (nao travar em parado)
            const gatoSrcNoAr = gato.elemento.src;
            const gatoNaoTravouParado = !(gatoSrcNoAr.includes('gato_parado') && gato.movendoHorizontal);
            assert(gatoNaoTravouParado, 'Gato nao travou em parado quando movendoHorizontal=true e noChao=false');

            // Teste 8: Pet parado (sem movimento) deve ficar em spriteParado
            cao.movendoHorizontal = false;
            cao.noChao = true;
            cao.contadorAnimacao = 0;
            cao.frameAtual = 0;
            window.atualizarAnimacao(cao, cao.elemento, cao.spriteParado, cao.spriteAndando, null, null, null);
            const caoParadoSrc = cao.elemento.src;
            assert(caoParadoSrc.includes('cao_parado') || caoParadoSrc.includes('cao_mov'), 'Cao parado mantem um sprite valido (parado ou andando)');

            // ==================== TESTES DE ANIMACAO DE PULO / INCLINACAO ====================
            log('--- Testes de animacao de pulo (inclinacao/tilt) ---', 'info');

            // Teste 9: aplicarRotacaoVerticalPet existe
            assert(typeof window.aplicarRotacaoVerticalPet === 'function', 'aplicarRotacaoVerticalPet e uma funcao');

            // Teste 10: Cao no ar subindo (velocidadeY negativa) deve receber rotacao
            cao.noChao = false;
            cao.velocidadeY = -5; // subindo
            cao.direcao = 'd';
            window.aplicarRotacaoVerticalPet(cao);
            const caoTransformSubindo = cao.elemento.style.transform;
            const caoRotacaoSubindo = caoTransformSubindo.includes('rotate(') && caoTransformSubindo.includes('deg');
            assert(caoRotacaoSubindo, 'Cao no ar subindo recebe rotacao (inclinacao) no transform');

            // Teste 11: Cao no ar caindo (velocidadeY positiva) deve receber rotacao oposta
            cao.noChao = false;
            cao.velocidadeY = 5; // caindo
            cao.direcao = 'd';
            window.aplicarRotacaoVerticalPet(cao);
            const caoTransformCaindo = cao.elemento.style.transform;
            const caoRotacaoCaindo = caoTransformCaindo.includes('rotate(') && caoTransformCaindo.includes('deg');
            assert(caoRotacaoCaindo, 'Cao no ar caindo recebe rotacao (inclinacao) no transform');

            // Teste 12: Gato no ar subindo deve receber rotacao
            gato.noChao = false;
            gato.velocidadeY = -5;
            gato.direcao = 'd';
            window.aplicarRotacaoVerticalPet(gato);
            const gatoTransformSubindo = gato.elemento.style.transform;
            const gatoRotacaoSubindo = gatoTransformSubindo.includes('rotate(') && gatoTransformSubindo.includes('deg');
            assert(gatoRotacaoSubindo, 'Gato no ar subindo recebe rotacao (inclinacao) no transform');

            // Teste 13: Pet no chão (noChao = true) deve ter rotacao zero (apenas scaleX)
            cao.noChao = true;
            cao.velocidadeY = 0;
            cao.direcao = 'd';
            window.aplicarRotacaoVerticalPet(cao);
            const caoTransformChao = cao.elemento.style.transform;
            // no chao: angulo e 0, entao so tem scaleX (sem inclinacao visivel)
            const caoTemScaleX = caoTransformChao.includes('scaleX');
            const caoSemInclinacao = !caoTransformChao.match(/rotate\(-[1-9]/) && !caoTransformChao.match(/rotate\([1-9]/);
            assert(caoTemScaleX && caoSemInclinacao, 'Cao no chao tem rotacao zero (apenas scaleX, sem inclinacao)');

            // ==================== TESTES DE GATOBATENTE ====================
            log('--- Testes de Gato de bolas (caca com metade cooldown, sem dano) ---', 'info');

            // Teste 14: window.temSkill deve existir
            assert(typeof window.temSkill === 'function', 'window.temSkill e uma funcao');

            // Teste 15: window.SKILLS deve ter GATOBATENTE
            assert(window.SKILLS && window.SKILLS.GATOBATENTE === 'Gato de bolas', 'SKILLS.GATOBATENTE definido como Gato de bolas');

            // Configurar ambiente para testar gatobatente
            window.playerSkills = ['Gato de bolas'];
            window.inimigos = [{
                x: gato.x + 50,
                y: gato.y,
                largura: 20,
                altura: 20,
                vida: 0,
                vidaMax: 3,
                estaMorto: false,
                estaMorrendo: false
            }];

            // Garantir que gato nao esta controlado
            window.controlandoGato = false;
            window.controlandoCao = false;
            window.controlandoBB = false;
            gatoNaBaseMock = false;
            window.gatoNaBase = false;

            // Teste 16: temSkill reconhece Gato de bolas
            const temGatoBatente = window.temSkill('Gato de bolas');
            assert(temGatoBatente === true, 'window.temSkill reconhece Gato de bolas');

            // Teste 17: Gatobatente funciona para gato (logica equivalente)
            const temSkillGatobatenteTeste = !!(typeof window.temSkill === 'function' && (window.temSkill('Gato de bolas') || window.temSkill('Gatobatente') || window.temSkill('Gatinho Batente')));
            const podeCacarInimigosGato = (gato.tipo === 'gato' && temSkillGatobatenteTeste);
            assert(podeCacarInimigosGato === true, 'Gato com Gato de bolas pode entrar em modo caca');

            // Teste 18: Cooldown do Gatobatente deve ser metade
            const cooldownBase = 600;
            const cooldownGato = Math.max(1, Math.round(cooldownBase / 2));
            assert(cooldownGato === 300, 'Cooldown Gato de bolas e metade (300 vs 600)');

            // Teste 19: Gatobatente nao deve aplicar dano
            const inimigoTeste = { vida: 0, vidaMax: 3, estaMorto: false, estaMorrendo: false };
            const ehGatobatente = true;
            if (!(gato.tipo === 'gato' && ehGatobatente)) {
                inimigoTeste.vida += 1;
            }
            // nao aplica dano
            assert(inimigoTeste.vida === 0, 'Gato de bolas nao aplica dano ao inimigo');

            // Teste 20: Ainda aplica stun/empurrão mesmo sem dano
            const inimigoTeste2 = { vida: 0, vidaMax: 3, estaMorto: false, estaMorrendo: false, stunned: false, stunTimer: 0, velocidadeKnockback: 0, framesKnockbackRestante: 0 };
            if (!(gato.tipo === 'gato' && ehGatobatente)) {
                // sem dano
            } else {
                inimigoTeste2.stunned = true;
                inimigoTeste2.stunTimer = 40;
                inimigoTeste2.velocidadeKnockback = 3;
                inimigoTeste2.framesKnockbackRestante = 6;
            }
            assert(inimigoTeste2.stunned === true && inimigoTeste2.stunTimer === 40, 'Gato de bolas aplica stun mesmo sem dano');
            assert(inimigoTeste2.velocidadeKnockback === 3, 'Gato de bolas aplica empurrao mesmo sem dano');
        }

        iniciarTeste();
    </script>
</body>
</html>
