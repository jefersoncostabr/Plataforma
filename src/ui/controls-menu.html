<div class="menu-controls-container">
    <div class="menu-settings-header">
        <h1 class="menu-title menu-title--controls" data-menu-title>CONTROLES</h1>
        <button id="btn-fechar-controls" 
            type="button" 
            class="menu-close menu-nav-item" 
            data-menu-mode="controls" 
            data-nav-type="close" 
            aria-label="Fechar controles" 
            title="Fechar">
        </button>
    </div>

    <div id="controls-help" class="menu-controls-help">
        <!-- Texto de ajuda injetado via JS -->
    </div>

    <div class="menu-controls-options menu-panel-base">
        <div id="controls-list-container" class="menu-controls-list-container">
            <!-- A lista dinâmica de teclas será injetada aqui -->
        </div>

        <div class="menu-controls-actions">
            <div id="btn-save-controls" class="menu-option menu-option--action menu-controls-action-btn menu-nav-item img-button retro-grid" title="SALVAR" data-menu-mode="controls">
                <img src="assets/icones/salvar.png" alt="Salvar">
            </div>
            <div id="btn-reset-controls" class="menu-option menu-option--action menu-controls-action-btn menu-nav-item img-button retro-grid" title="RESTAURAR" data-menu-mode="controls">
                <img src="assets/icones/voltar.png" alt="Restaurar">
            </div>
        </div>
    </div>
</div>

<!-- Template para as linhas de controle (migrado do JS) -->
<template id="control-row-template">
    <div class="menu-option menu-option--control menu-controls-line menu-nav-item" data-menu-mode="controls">
        <span class="menu-controls-label"></span>
        <span class="menu-controls-key"></span>
    </div>
</template>
