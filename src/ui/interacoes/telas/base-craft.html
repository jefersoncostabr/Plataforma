<div class="base-panel">
    <p>
        Esta é a base permanente da campanha. O menu abre com a tecla <strong>E</strong> quando o personagem está sobre o sprite da base.
    </p>

    <div class="base-stats">
        <div class="base-stat-card">
            <strong>Nível</strong>
            <span data-interaction-field="nivel">-</span>
        </div>
    </div>

    <div class="base-tip" data-interaction-feedback>
        Você pode recolher a base para um slot e reinstalá-la depois no mesmo nível. Também é possível reinstalar pelo menu de slots usando Enter.
    </div>

    <div class="base-actions">
        <button type="button" class="btn-primary" data-interaction-action="recolher-base" data-primary-action>Recolher</button>
        <button type="button" class="btn-secondary" data-interaction-close>Fechar</button>
    </div>
</div>
