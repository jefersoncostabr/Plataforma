<div class="interaction-content interaction-content--crafting">
    <p class="crafting-intro-text">Combine itens para criar novos. Dois equipamentos criam sucata. Sucata + 1 SP cria Airdrop Plus.</p>

    <div class="crafting-recipe-display">
        <div class="crafting-slot" id="craft-slot-1" tabindex="0" role="button" aria-label="Slot de criação 1">?</div>
        <span class="crafting-operator">+</span>
        <div class="crafting-slot" id="craft-slot-2" tabindex="0" role="button" aria-label="Slot de criação 2">?</div>
        <span class="crafting-operator">=</span>
        <div
            class="crafting-slot crafting-slot--result result-slot"
            id="craft-result-slot"
            tabindex="0"
            role="button"
            aria-label="Resultado do crafting. Pressione Enter para criar">
            ?
        </div>
    </div>

    <div class="player-inventory-for-crafting">
        <!-- Player's inventory items will be dynamically inserted here -->
        <p class="crafting-placeholder-text">Seus itens aparecerão aqui.</p>
    </div>

    <div class="interaction-footer interaction-footer--crafting">
        <button type="button" id="btn-voltar-base" class="btn-voltar-base">
            Voltar para Base
        </button>
    </div>

    <div data-interaction-feedback class="interaction-feedback interaction-feedback--crafting"></div>
</div>
